<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melissa for Polymarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1117; --panel:#151c25; --panel2:#1d2631; --line:#26313d; --text:#e8edf2; --mute:#8a97a6; --dim:#56636f;
  --yes:#22c55e; --yes-d:rgba(34,197,94,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 2px 1fr auto}

/* ---------- chrome ---------- */
header{display:flex;align-items:center;gap:20px;padding:12px 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:8px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mute)}
.chapters{display:flex;gap:2px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.chapters::-webkit-scrollbar{display:none}
.chapters button{background:none;border:0;color:var(--dim);font-weight:600;font-size:12.5px;padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:color .2s,background .2s}
.chapters button:hover{color:var(--text)}
.chapters button.done{color:var(--mute)}
.chapters button.on{color:var(--text);background:var(--panel2)}
.chapters i{font-style:normal;font-size:10.5px;color:var(--dim)}
.chapters button.done i{color:var(--yes)}
.contact{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.mob-step{display:none;font-size:12.5px;color:var(--mute);font-weight:600;margin-left:auto}
.progress{background:var(--panel)}
.progress em{display:block;height:100%;background:var(--yes);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(34,197,94,.6)}
footer{display:flex;align-items:center;gap:14px;padding:11px 28px;border-top:1px solid var(--line)}
.nbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:9px;cursor:pointer}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.next{margin-left:auto;background:var(--yes);color:#04210f;border-color:var(--yes);font-weight:700}
.hint{font-size:12px;color:var(--dim)}
.hint kbd{font:600 11px Inter,sans-serif;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--mute)}

/* ---------- chapter layout ---------- */
.stage{position:relative;overflow:hidden}
.ch{position:absolute;inset:0;padding:22px 28px 22px 44px;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s}
.ch.on{opacity:1;visibility:visible;transition:opacity .5s ease}
.in{height:100%;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(270px,330px) 1fr;gap:36px;align-items:center}
.tell{align-self:center}
.r{opacity:0;transform:translateY(12px)}
.ch.on .r{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--yes);margin-bottom:14px}
.eyebrow b{background:var(--yes-d);border-radius:5px;padding:3px 7px}
.tell h1{font-size:clamp(32px,3.3vw,46px);font-weight:900;letter-spacing:-.04em;line-height:1.02}
.tell h2{font-size:clamp(28px,2.7vw,38px);font-weight:900;letter-spacing:-.035em;line-height:1.05}
.tell p{font-size:15.5px;color:var(--mute);margin-top:14px;line-height:1.5}
.tell p b{color:var(--text);font-weight:600}
.facts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.facts div{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.facts b{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--yes);min-width:78px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.pills span{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;color:#c9d2dc}
.cta{margin-top:24px;display:inline-flex;gap:10px;align-items:center;background:var(--yes);color:#04210f;border:0;border-radius:10px;padding:12px 18px;font-weight:800;font-size:14.5px;cursor:pointer;text-decoration:none}
.small{font-size:12.5px;color:var(--mute);margin-top:12px}
.small a{color:#c9d2dc}

/* ---------- show stage ---------- */
.show{position:relative;height:100%;min-height:0;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(55% 60% at 78% 12%,rgba(34,197,94,.11),transparent 70%),radial-gradient(50% 55% at 8% 95%,rgba(59,130,246,.11),transparent 70%),#0a0f15}
.show::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(75% 75% at 50% 50%,#000 30%,transparent 100%);mask-image:radial-gradient(75% 75% at 50% 50%,#000 30%,transparent 100%);pointer-events:none}
.cv{position:absolute;left:50%;top:50%;width:760px;height:500px;transform-origin:center center}
.replay{position:absolute;right:12px;top:12px;z-index:30;background:rgba(21,28,37,.85);border:1px solid var(--line);color:var(--mute);font:600 11.5px Inter,sans-serif;padding:6px 10px;border-radius:8px;cursor:pointer;backdrop-filter:blur(6px)}
.replay:hover{color:var(--text)}
.note{position:absolute;left:14px;bottom:10px;z-index:30;font-size:10.5px;color:var(--dim)}
.note.hl{color:#86efac;font-weight:600}

/* ---------- shared mock UI ---------- */
.w{position:absolute;background:#fff;border-radius:12px;overflow:hidden;color:#18202b;font-size:12px;line-height:1.35;
  box-shadow:0 40px 80px -28px rgba(0,0,0,.75),0 14px 28px -14px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07)}
.wb{height:28px;display:flex;align-items:center;gap:6px;padding:0 11px;background:linear-gradient(#fbfcfd,#eff2f5);border-bottom:1px solid #e3e7ec;font-size:11px;font-weight:600;color:#5b6676;white-space:nowrap}
.wb i{width:10px;height:10px;border-radius:50%;flex:none}
.wb i:nth-child(1){background:#ff5f57}.wb i:nth-child(2){background:#febc2e}.wb i:nth-child(3){background:#28c840}
.wb span{margin-left:8px}
.wb em{margin-left:auto;font-style:normal}
.pop{animation:wpop .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes wpop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:8.5px;font-weight:800;text-decoration:none;flex:none}
.mchip{font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;background:#eef1f5;color:#6b7686;white-space:nowrap}
.mchip.g{background:#dcfce7;color:#15803d}
.mchip.b{background:#e0eaff;color:#1d4ed8}
.mchip.a{background:#fef3c7;color:#b45309}
.mchip.rd{background:#fee2e2;color:#b91c1c}
.tag{position:absolute;font:800 11px Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#8a97a6;display:flex;align-items:center;gap:8px;transition:opacity .6s,color .6s}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.18)}
.tag.g{color:#bff3d2}.tag.g::before{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
@keyframes ping{from{transform:scale(1);opacity:.85}to{transform:scale(2.3);opacity:0}}

/* ===== 0 · inbox → program ===== */
.em{position:absolute;width:226px;background:#fff;border-radius:10px;padding:9px 11px 10px 14px;color:#18202b;
  box-shadow:0 16px 30px -12px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.04);opacity:0;transform:rotate(var(--r)) translateY(12px) scale(.9);
  transition:opacity .35s,transform .55s cubic-bezier(.2,.9,.3,1.3)}
.em.shw{opacity:1;transform:rotate(var(--r))}
.em.fly{transition:left .9s cubic-bezier(.7,0,.25,1),top .9s cubic-bezier(.7,0,.25,1),transform .9s cubic-bezier(.7,0,.25,1),opacity .9s ease-in}
.em::before{content:"";position:absolute;left:5px;top:15px;width:6px;height:6px;border-radius:50%;background:#2f6bff}
.emh{display:flex;align-items:center;gap:7px;font-size:10.5px}
.emh b{font-weight:600;color:#5b6676}
.emh time{margin-left:auto;color:#9aa4b2;font-size:10px}
.em p{font-weight:700;font-size:12px;margin:5px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em span{font-size:11px;color:#6b7686;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em .bang{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 3px #0a0f15}
.inbox{position:absolute;font-size:12px;font-weight:600;color:#fecaca;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);padding:6px 12px;border-radius:999px;transition:.5s}
.inbox b{font-weight:900;color:#fff}
.inbox.ok{color:#bbf7d0;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4)}
.prog{opacity:0;transform:translateY(16px) scale(.97);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.prog.vis{opacity:1;transform:none}
.prog.glow{box-shadow:0 40px 80px -28px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07),0 0 60px -10px rgba(34,197,94,.45)}
.pr-rows{position:relative;padding:12px 14px 4px}
.pr-line{position:absolute;left:31px;top:30px;width:2px;height:240px;background:#e6e9ef}
.pr-line em{display:block;width:100%;height:0;background:linear-gradient(#22c55e,#16a34a);transition:height .45s}
.prr{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:9px 6px;border-radius:10px;position:relative;transition:background .5s}
.prr .n{width:34px;height:34px;border-radius:10px;background:#f1f4f8;border:1px solid #e3e7ec;display:grid;place-items:center;color:#8a95a3;z-index:1;transition:.45s}
.prr .n svg{width:17px;height:17px}
.prr b{font-size:13px;display:block;letter-spacing:-.01em}
.prr span{font-size:11px;color:#6b7686}
.prr .st{font-size:10px;font-weight:800;color:#9aa4b2;background:#f1f4f8;border-radius:999px;padding:3px 8px;transition:.4s}
.prr.on{background:#f2fbf5}
.prr.on .n{background:#16a34a;border-color:#16a34a;color:#fff;box-shadow:0 8px 18px -6px rgba(22,163,74,.75)}
.prr.on .st{background:#dcfce7;color:#15803d}
.pr-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 14px;border-top:1px solid #eef1f5;margin-top:4px}
.pr-k div{background:#f6f8fb;border-radius:9px;padding:8px 10px;opacity:.35;transition:opacity .5s}
.pr-k div.on{opacity:1}
.pr-k b{display:block;font-size:19px;font-weight:900;letter-spacing:-.03em;color:#15803d}
.pr-k span{font-size:10px;color:#6b7686}
.beam{position:absolute;left:300px;top:150px;width:110px;height:200px;pointer-events:none;opacity:0;transition:opacity .6s;
  background:radial-gradient(60% 50% at 50% 50%,rgba(34,197,94,.35),transparent 70%);filter:blur(8px)}
.beam.on{opacity:1}

/* ===== gantt ===== */
.gh{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #eef1f5;height:54px}
.gh h4{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.gh p{font-size:11px;color:#6b7686}
.gtabs{margin-left:auto;display:flex;gap:2px;background:#f1f4f8;border-radius:8px;padding:3px}
.gtabs span{font-size:11px;font-weight:600;color:#6b7686;padding:4px 10px;border-radius:6px}
.gtabs .on{background:#fff;color:#18202b;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gbody{position:relative;height:418px;overflow:hidden}
.gph{position:absolute;top:0;bottom:0;border-left:1px dashed #e3e7ec}
.gph.alt{background:#fafbfd}
.gph span{position:absolute;left:10px;top:11px;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8a95a3;white-space:nowrap}
.grow{position:absolute;left:0;right:0;border-bottom:1px solid #f1f3f6;display:flex;align-items:center;gap:9px;padding-left:16px;opacity:0;transform:translateX(-8px);transition:.45s}
.grow.on{opacity:1;transform:none}
.grow > div{width:178px}
.grow b{font-size:12px;display:block;white-space:nowrap;letter-spacing:-.005em}
.grow span{font-size:10.5px;color:#7b8695;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.gbar{position:absolute;height:28px;border-radius:8px;transform:scaleX(0);transform-origin:left center;transition:transform .75s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:6px;padding:0 9px;overflow:hidden;z-index:2;font-size:10.5px;font-weight:700}
.gbar.on{transform:scaleX(1)}
.gbar .gl,.gbar em{position:relative;z-index:1;opacity:0;transition:opacity .3s .55s;white-space:nowrap}
.gbar.on .gl,.gbar.on em{opacity:1}
.gbar em{margin-left:auto;font-style:normal;font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.25)}
.gbar svg{width:11px;height:11px;flex:none;position:relative;z-index:1;opacity:0;transition:opacity .3s .55s}
.gbar.on svg{opacity:1}
.k-done{background:linear-gradient(180deg,#27c964,#16a34a);color:#fff;box-shadow:0 8px 16px -8px rgba(22,163,74,.7)}
.k-live,.k-plan{background:linear-gradient(180deg,#4f86ff,#2f6bff);color:#fff;box-shadow:0 8px 16px -8px rgba(47,107,255,.7)}
.k-plan.alt{background:linear-gradient(180deg,#7c6cff,#5b4bff);box-shadow:0 8px 16px -8px rgba(91,75,255,.7)}
.k-prog{background:#e5edff;color:#1d4ed8;border:1px solid #bfd1ff}
.k-prog .gf{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(-45deg,#a6c0ff 0 6px,#c7d8ff 6px 12px);background-size:17px 17px;animation:stripes .9s linear infinite;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
@keyframes stripes{to{background-position:17px 0}}
.k-prog em{background:#2f6bff;color:#fff}
.k-des{background:linear-gradient(180deg,#9061f9,#7c3aed);color:#fff;box-shadow:0 8px 16px -8px rgba(124,58,237,.7)}
.grow.click,.gbar.click{cursor:pointer}
.grow.click:hover{background:#f4f7ff}
.gbar.click:hover{filter:brightness(1.08);outline:2px solid rgba(47,107,255,.35);outline-offset:2px}
.k-next{background:#fffaf0;border:1.5px dashed #f0b44c;color:#b7791f}
.k-next em{background:#fde68a;color:#92400e}
.ghz{position:absolute;height:28px;border-radius:0 8px 8px 0;background:repeating-linear-gradient(-45deg,#bbf7d0 0 5px,#dcfce7 5px 10px);border:1px solid #86efac;border-left:0;transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.8,.2,1);z-index:1}
.ghz.on{transform:scaleX(1)}
.gdeps{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
.gdeps path{fill:none;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s,opacity .2s;opacity:0}
.gdeps path.on{stroke-dashoffset:0;opacity:1}
.gms{position:absolute;z-index:4;transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,.9,.3,1.5)}
.gms.on{transform:translate(-50%,-50%) scale(1)}
.gms i{display:block;width:14px;height:14px;background:#18202b;transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 3px #fff}
.gms span{position:absolute;left:20px;top:-3px;white-space:nowrap;background:#18202b;color:#fff;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:6px}
.grb{position:absolute;z-index:4;transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,.9,.3,1.5);background:#fef3c7;color:#b45309;border:1px solid #fcd34d;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.grb.on{transform:translate(-50%,-50%) scale(1)}
.gtd{position:absolute;top:34px;bottom:40px;width:2px;background:#2f6bff;z-index:5;opacity:0;transition:opacity .3s}
.gtd.on{opacity:1}
.gtd span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);background:#2f6bff;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;white-space:nowrap}
.gtd::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:#2f6bff}
.gtd::before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;border:2px solid #2f6bff;animation:ping 1.6s infinite;box-sizing:border-box}
.glg{position:absolute;left:16px;bottom:11px;display:flex;gap:16px;font-size:10.5px;color:#6b7686;opacity:0;transition:opacity .6s}
.glg.on{opacity:1}
.glg i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:6px;vertical-align:0}

/* ===== 2 · annotated email ===== */
.mh{border-bottom:1px solid #eef1f5;padding:4px 16px}
.mrow{display:flex;align-items:center;gap:10px;height:26px;font-size:11.5px}
.mrow label{width:50px;color:#8a95a3}
.mrow + .mrow{border-top:1px solid #f3f5f8}
.pchip{display:inline-flex;align-items:center;gap:6px;background:#eef3ff;border:1px solid #d6e2ff;color:#1d4ed8;border-radius:999px;padding:2px 9px 2px 2px;font-weight:600;font-size:11px}
.subj{font-weight:700;min-height:14px}
.mb{padding:12px 16px 6px;font-size:12px;color:#2b3442}
.mb p{min-height:16px}
.slots{margin:10px 0 8px;display:grid;gap:6px}
.slot{position:relative;display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;background:#f6f8fb;border:1px solid #edf0f4;border-radius:9px;padding:6px 10px;opacity:0;transform:translateX(-10px);transition:.45s cubic-bezier(.2,.8,.2,1);max-height:60px}
.slot.on{opacity:1;transform:none}
.slot time{font-weight:800;font-size:11px;color:#1d4ed8}
.slot b{font-size:11.5px;display:block}
.slot span{font-size:10.5px;color:#7b8695}
.slot.rec{background:#fff5f5;border:1px dashed #fca5a5}
.slot.rec time{color:#b91c1c}
.slot .strike{position:absolute;left:10px;top:50%;height:2px;width:0;background:#dc2626;transition:width .6s cubic-bezier(.6,0,.2,1)}
.slot.rec.x{opacity:.6}
.slot.rec.x .strike{width:calc(100% - 20px)}
.slot .xchip{position:absolute;right:8px;top:50%;transform:translateY(-50%) scale(0);transition:transform .35s cubic-bezier(.2,.9,.3,1.5)}
.slot.rec.x .xchip{transform:translateY(-50%) scale(1)}
.mf{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid #eef1f5;background:#fff}
.send{background:#2f6bff;color:#fff;font-weight:800;font-size:12px;padding:7px 16px;border-radius:8px;transition:transform .15s,background .3s;white-space:nowrap;flex:none}
.mf small.ok{color:#15803d;font-weight:700}
.send.press{transform:scale(.92)}
.send.done{background:#16a34a}
.mf small{font-size:10.5px;color:#8a95a3}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#22c55e;color:#04210f;font:900 11px Inter,sans-serif;display:grid;place-items:center;z-index:12;transform:scale(0);transition:transform .45s cubic-bezier(.2,.9,.3,1.6);box-shadow:0 0 0 4px rgba(34,197,94,.25),0 6px 14px rgba(0,0,0,.4)}
.pin.on{transform:scale(1)}

.bpc{position:absolute;top:68px;height:340px;background:none;border:0;border-radius:14px;padding:0;cursor:pointer;color:inherit;font-family:inherit;text-align:center;transition:background .25s}

.bpc.a-on .bb{opacity:.42;filter:grayscale(.6);transform:none}
.barr{position:absolute;left:50%;top:192px;width:24px;height:24px;margin-left:-12px;border-radius:50%;display:grid;place-items:center;background:#0a0f15;border:1.5px solid #2a3542;color:#2a3542;transition:.4s}

.baf{top:224px;height:96px;background:#fff;color:#18202b;border-top:3px solid #22c55e;box-shadow:0 20px 34px -18px rgba(0,0,0,.8);opacity:0;transform:translateY(14px) scale(.92)}
.bpc.nh .baf{border-top-color:#8b5cf6}
.bpc.a-on .baf{opacity:1;transform:none}
.baf b{display:block;font-size:11px;font-weight:900;line-height:1.2;letter-spacing:-.01em}
.baf span{display:block;font-size:9.5px;color:#5b6676;margin-top:4px;line-height:1.25}
.baf::after{content:"";position:absolute;right:7px;bottom:7px;width:15px;height:15px;border-radius:50%;background:#22c55e url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 12 4 4 8-8'/></svg>") center/10px no-repeat}

.bpc.nh:hover .baf{box-shadow:0 26px 40px -18px rgba(0,0,0,.85),0 0 0 2px rgba(139,92,246,.7)}
.bgo{position:absolute;left:0;right:0;top:326px;font-size:9.5px;font-weight:800;color:#86efac;opacity:0;transition:opacity .2s}
.bpc.nh .bgo{color:#c4b5fd}
.bpc:hover .bgo{opacity:1}
.bpc.nudge .baf{animation:nudge 1.2s ease-in-out 2}
@keyframes nudge{50%{transform:translateY(-6px);box-shadow:0 26px 40px -18px rgba(0,0,0,.85),0 0 0 3px rgba(34,197,94,.7)}}
.bscan{position:absolute;top:154px;height:200px;width:3px;margin-left:-1px;border-radius:2px;background:#4ade80;box-shadow:0 0 18px 4px rgba(74,222,128,.75),0 0 60px 10px rgba(34,197,94,.35);opacity:0;transition:opacity .3s;z-index:6;pointer-events:none}
.bscan.on{opacity:1}
.bflow{position:absolute;top:404px;height:2px;background:linear-gradient(90deg,rgba(34,197,94,.5),rgba(139,92,246,.5));opacity:0;transition:opacity .6s;border-radius:2px}
.bflow.on{opacity:1}
.bflow i{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(134,239,172,.9);animation:flowdot 3.2s linear infinite}
@keyframes flowdot{from{left:0}to{left:100%}}
.bhint{position:absolute;transform:translateX(-50%) translateY(8px);display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:#e8edf2;background:rgba(21,28,37,.92);border:1px solid #2f3b49;border-radius:999px;padding:7px 14px 7px 10px;opacity:0;transition:.5s;white-space:nowrap}
.bhint.on{opacity:1;transform:translateX(-50%)}
.bhint i{width:9px;height:9px;border-radius:50%;background:#22c55e;position:relative}
.bhint i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #22c55e;animation:ping 1.6s infinite}

/* ===== drawer ===== */
.dback{position:fixed;inset:0;background:rgba(5,8,12,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:80}
.dback.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:#10161d;border-left:1px solid var(--line);box-shadow:-40px 0 80px -20px rgba(0,0,0,.6);z-index:90;transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:22px 26px 26px}
.drawer.open{transform:none}
.dtop{display:flex;align-items:center;justify-content:space-between}
.dk{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--yes)}
.dx{background:var(--panel2);border:1px solid var(--line);color:var(--mute);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:13px}
.dx:hover{color:var(--text)}
.dt{font-size:28px;font-weight:900;letter-spacing:-.035em;line-height:1.08;margin-top:8px}
.ds{font-size:13.5px;color:var(--mute);margin:4px 0 16px}
.dmap{display:flex;gap:5px;margin:0 0 18px}
.dmap button{flex:1;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:800 11px Inter,sans-serif;cursor:pointer;transition:.2s}
.dmap button:hover{color:var(--text)}
.dmap button.on{background:#22c55e;border-color:#22c55e;color:#04210f}
.dmap button.nh.on{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.bcol{border-radius:14px;padding:15px 17px}
.bcol .bl{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.bcol .bl i{width:8px;height:8px;border-radius:50%}
.bcol h4{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:7px 0 8px;line-height:1.25}
.bcol ul{list-style:none;display:grid;gap:7px}
.bcol li{font-size:13.5px;line-height:1.48;padding-left:18px;position:relative}
.before{background:rgba(239,68,68,.06);border:1px dashed rgba(248,113,113,.4)}
.before .bl{color:#f87171}.before .bl i{background:#f87171}
.before h4{color:#fecaca}
.before li{color:#b8a3a3}
.before li::before{content:"✕";position:absolute;left:0;top:0;font-size:10px;font-weight:900;color:#f87171}
.after{background:linear-gradient(180deg,rgba(34,197,94,.10),rgba(34,197,94,.04));border:1px solid rgba(34,197,94,.45);box-shadow:0 0 40px -16px rgba(34,197,94,.5)}
.after .bl{color:#4ade80}.after .bl i{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.2)}
.after h4{color:#fff}
.after li{color:#d3dbe3}
.after li::before{content:"✓";position:absolute;left:0;top:0;font-size:11px;font-weight:900;color:#4ade80}
.bjoin{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.bjoin span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid #1f7a45;color:#4ade80;font-size:13px}
.dflow{margin-top:18px}
.bl.plain{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fs{font-size:12.5px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;opacity:.25;transform:translateY(4px);transition:.35s}
.fs.on{opacity:1;transform:none;border-color:#1f7a45;background:#12201a;color:#d1fadf}
.fa{width:14px;height:2px;background:var(--line);position:relative;transition:.35s;opacity:.3}
.fa.on{background:#22c55e;opacity:1}
.fa::after{content:"";position:absolute;right:-2px;top:-3px;border:4px solid transparent;border-left-color:inherit;border-left:5px solid currentColor;color:var(--line)}
.fa.on::after{color:#22c55e}
.dwins{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dwins span{font-size:12px;font-weight:700;color:#bbf7d0;background:var(--yes-d);border-radius:999px;padding:6px 11px}
.dnav{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.dnav button{background:var(--panel);border:1px solid var(--line);color:var(--text);font:600 13px Inter,sans-serif;padding:9px 14px;border-radius:9px;cursor:pointer}
.dnav .dnext{background:var(--yes);border-color:var(--yes);color:#04210f;font-weight:800}
.dpos{font-size:12px;color:var(--dim);font-weight:600}
.drawer.anim .dt,.drawer.anim .ds,.drawer.anim .before,.drawer.anim .bjoin,.drawer.anim .after,.drawer.anim .dwins{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.drawer.anim .ds{animation-delay:.04s}.drawer.anim .before{animation-delay:.1s}.drawer.anim .bjoin{animation-delay:.2s}.drawer.anim .after{animation-delay:.28s}.drawer.anim .dwins{animation-delay:.9s}
@media (max-width:860px){ .drawer{width:100%;top:auto;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)} .drawer.open{transform:none} }


/* ===== storybook chrome ===== */
.chapters{display:none!important}
.mob-step{display:block!important;margin:0 auto;font-size:13px;color:var(--mute);font-weight:600}
.mob-step em{font-style:italic;color:var(--yes);font-weight:700}
.toc-btn{white-space:nowrap;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font:600 13px Inter,sans-serif;cursor:pointer}
.toc-btn:hover{background:var(--panel2)}
.hint b{color:var(--mute);font-weight:700}
.stage{perspective:2200px}
.ch{transform:translateX(46px) rotateY(-7deg);transform-origin:left center;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s .55s}
.ch.prev{transform:translateX(-46px) rotateY(7deg);transform-origin:right center}
.ch.on{transform:none;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.chl{font-style:italic;font-weight:700;letter-spacing:.04em;text-transform:none;font-size:13px;color:var(--yes)}
.toc{position:fixed;inset:0;z-index:95;background:rgba(5,8,12,.6);backdrop-filter:blur(4px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;padding:16px}
.toc.open{opacity:1;pointer-events:auto}
.toc-in{width:min(520px,100%);background:#10161d;border:1px solid var(--line);border-radius:18px;padding:20px 22px;transform:translateY(12px);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto}
.toc.open .toc-in{transform:none}
.toc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.toc-h span{font-size:20px;font-weight:900;letter-spacing:-.02em}
.toc ol{list-style:none}
.toc li{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:baseline;padding:10px 8px;border-radius:9px;cursor:pointer;border-top:1px solid var(--line)}
.toc li:hover{background:var(--panel2)}
.toc li.on{background:var(--yes-d)}
.toc li span{font-size:12px;font-style:italic;color:var(--yes);font-weight:700}
.toc li b{font-size:15px;font-weight:700}
.toc li em{font-style:normal;font-size:12px;color:var(--dim)}
.rtabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;margin-top:18px}
.rtabs button{background:none;border:0;color:var(--mute);font:700 13px Inter,sans-serif;padding:8px 12px;border-radius:7px;cursor:pointer}
.rtabs button.on{background:var(--yes);color:#04210f}
.rtabs + .cta{display:flex;width:max-content}

/* ===== cover book ===== */
.bk-scene{position:absolute;inset:0;perspective:1800px}
.book{position:absolute;left:380px;top:34px;width:300px;height:410px;transform-style:preserve-3d;transform:translateX(-150px) rotateX(6deg);transition:transform 1.6s cubic-bezier(.6,0,.2,1)}
.book.open{transform:translateX(0) rotateX(0)}
.bk-edge{position:absolute;right:-8px;top:6px;bottom:6px;width:10px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(90deg,#e9ecef 0 1px,#fff 1px 3px);box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.bk-page{position:absolute;inset:0;background:#fdfdfb;border-radius:2px 10px 10px 2px;box-shadow:0 40px 80px -24px rgba(0,0,0,.75),inset 14px 0 18px -14px rgba(0,0,0,.25);color:#18202b}
.bk-pg{padding:28px 26px}
.bk-pg h6{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#16a34a;margin-bottom:12px}
.bk-pg ol{list-style:none}
.bk-pg li{cursor:default!important;display:grid;grid-template-columns:24px auto 1fr 18px;gap:6px;align-items:baseline;padding:5px 6px;margin:0 -6px;border-radius:6px;font-size:11.5px;cursor:pointer;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s,background .2s}
.bk-pg li.on{opacity:1;transform:none}
.bk-pg li:hover{background:#eefaf2}
.bk-pg li span{font-style:italic;color:#6b7686;font-size:10.5px}
.bk-pg li b{font-weight:700;white-space:nowrap}
.bk-pg li i{border-bottom:1.5px dotted #cbd2dc;height:1px;align-self:center;margin-top:4px}
.bk-pg li em{font-style:normal;font-weight:700;color:#8a95a3;text-align:right;font-size:10.5px}
.bk-cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.8s cubic-bezier(.6,0,.2,1) .2s;z-index:3}
.book.open .bk-cover{transform:rotateY(-178deg)}
.bk-front,.bk-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 10px 10px 2px}
.bk-front{background:radial-gradient(120% 90% at 80% 0%,#1b3a2a 0%,#0e1a14 55%,#0a110d 100%);box-shadow:0 40px 80px -24px rgba(0,0,0,.8),inset 6px 0 0 #0a120e,inset 9px 0 0 rgba(255,255,255,.06)}
.bk-frame{position:absolute;inset:16px;border:1px solid rgba(134,239,172,.45);border-radius:6px;padding:26px 22px;display:flex;flex-direction:column;color:#e8f5ec}
.bk-mk{width:34px;height:34px;border-radius:8px;border:1px solid rgba(134,239,172,.6);display:grid;place-items:center;font-weight:900;font-size:12px;color:#86efac}
.bk-frame small{margin-top:26px;font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#86efac}
.bk-frame h3{font-size:46px;font-weight:900;letter-spacing:-.045em;line-height:.95;margin-top:12px}
.bk-frame h3 em{font-weight:400;font-style:italic;color:#86efac}
.bk-frame p{font-size:12px;color:#a7bfb0;margin-top:14px;line-height:1.45}
.bk-frame b{margin-top:auto;font-size:13px;letter-spacing:.02em}
.bk-back{transform:rotateY(180deg);background:#f6f7f4;border-radius:10px 2px 2px 10px;box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.25)}
.bk-ded{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:34px;color:#18202b}
.bk-ded small{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#16a34a}
.bk-ded p{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:14px}
.bk-ded span{margin-top:12px;font-style:italic;color:#6b7686;font-size:12px}

/* ===== prologue ===== */
.cpath{position:absolute;left:0;top:0;width:760px;height:500px;overflow:visible}
.cp-base{fill:none;stroke:#26313d;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
.cp-lit{fill:none;stroke:#22c55e;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(34,197,94,.8))}
.cp-dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#0a0f15;border:2px solid #34414f;transition:.4s;z-index:2}
.cp-dot.on{background:#22c55e;border-color:#22c55e;box-shadow:0 0 0 7px rgba(34,197,94,.18)}
.cp-dot.nx.on{background:#0a0f15;border:2px dashed #86efac;box-shadow:0 0 0 7px rgba(134,239,172,.12)}
.cp-card{position:absolute;background:#fff;color:#18202b;border-radius:12px;padding:11px 13px;box-shadow:0 30px 60px -24px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);opacity:0;transform:translateY(10px) scale(.96);transition:.55s cubic-bezier(.2,.8,.2,1);z-index:3}
.cp-card.on{opacity:1;transform:none}
.cp-card small{font-size:9.5px;font-weight:900;letter-spacing:.1em;color:#16a34a}
.cp-card b{display:block;font-size:13.5px;font-weight:900;letter-spacing:-.015em;margin-top:2px}
.cp-card .ti{display:block;font-size:10.5px;color:#6b7686;font-weight:600;margin-top:1px;line-height:1.3}
.cp-card p{font-size:11px;color:#2b3442;margin-top:6px;line-height:1.38}
.cp-card.nx{background:rgba(34,197,94,.08);border:1.5px dashed rgba(134,239,172,.7);color:#e8f5ec;box-shadow:none}
.cp-card.nx small{color:#86efac}.cp-card.nx .ti{color:#a7bfb0}.cp-card.nx p{color:#d1fadf}
.cp-ps{position:absolute;font-size:10.5px;font-weight:700;color:#5d6b7b;letter-spacing:.02em}

/* ===== principles ===== */
.pc{padding:16px 18px;display:flex;flex-direction:column}
.pc.pop{opacity:1!important}
.pc-t{display:flex;align-items:center;gap:10px}
.pc-n{font-size:11px;font-weight:900;color:#16a34a;background:#dcfce7;border-radius:6px;padding:2px 7px}
.pc-t b{font-size:17px;font-weight:900;letter-spacing:-.025em}
.pc p{font-size:12.5px;color:#4b5565;margin-top:8px;line-height:1.45}
.pc-v{position:relative;margin-top:auto;height:74px;border-top:1px solid #eef1f5;padding-top:10px}
.pvb{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:center;font-size:10.5px;font-weight:700;color:#5b6676;margin-bottom:9px}
.pvb > div{height:14px;background:#f1f3f6;border-radius:4px;overflow:hidden}
.pvb i{display:block;height:100%;border-radius:4px;transition:width 1.6s cubic-bezier(.6,0,.2,1)}
.pvb .bw{width:84%;background:#cbd2dc}
.pvb .tp{width:18%;background:linear-gradient(90deg,#22c55e,#16a34a)}
.gear{position:absolute;fill:#18202b}
.gear.g1{left:10px;top:12px;width:50px;height:50px;animation:spin 6s linear infinite}
.gear.g2{left:52px;top:30px;width:34px;height:34px;fill:#22c55e;animation:spin 4s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pv-how .mchip{position:absolute;left:110px;top:30px;font-size:11px}
.dd{position:absolute;width:12px;height:12px;border-radius:50%;margin-top:8px;transition:left 1s cubic-bezier(.6,0,.2,1),top 1s cubic-bezier(.6,0,.2,1),background .6s}
.pv-abc svg{width:100%;height:64px;overflow:visible}
.pv-abc .br{fill:none;stroke:#cbd2dc;stroke-width:2.2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s ease,stroke .3s}
.pv-abc .br.on{stroke-dashoffset:0;stroke:#16a34a}
.pv-abc text{font:900 11px Inter,sans-serif;fill:#16a34a}

/* ===== adoption ===== */
.adl{position:absolute;left:0;top:0;width:760px;height:500px;overflow:visible}
.ad-ln{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;opacity:.75;transition:stroke-dashoffset .8s ease}

.gx-ring{display:none}

@keyframes fillgo{to{width:100%}}
.gx-role{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;margin-top:18px;width:max-content;max-width:100%}

.gx-mk{position:absolute;inset:34px 30px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
.gx-m{position:relative;text-align:left;background:#fff;color:#18202b;border:2px solid transparent;border-radius:16px;padding:20px 20px 18px 62px;font-family:inherit;cursor:pointer;box-shadow:0 24px 50px -24px rgba(0,0,0,.8);animation:rise .5s both;transition:border-color .2s,transform .2s}

.gx-m.on{border-color:#16a34a;background:#f2fbf5}

.gx-ct .cta{margin:0}
.gx-ct span{font-size:12.5px;color:var(--mute)}
@media (max-width:860px){
  body{overflow:auto}
  .gx{height:auto;min-height:100%}
  .gx-top{padding:10px 16px}.gx-sp{display:none}.brand small{display:none}
  .gx-mkt{font-size:12px;padding:6px 10px;gap:7px}
  .gx-main{display:block;padding:18px 16px}
  .gx-stage{height:auto;aspect-ratio:760/520;margin-top:18px}
  .gx-m b{font-size:20px}.gx-m em{font-size:14px}
  .gx-foot{position:sticky;bottom:0;background:var(--bg);padding:10px 16px}
  .gx-hint{display:none}
  .gx-stamp{font-size:10.5px;padding:4px 8px;right:10px;top:10px}
  .gx-stamp.on{transform:none}.gx-go{min-width:0;margin-left:auto;font-size:14px}
}

<script>
(function(){
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tok = 0, timers = [], S = 1;
const eo = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
function T(ms, fn){ const t = tok; timers.push(setTimeout(() => { if (t === tok) fn(); }, RM ? 0 : ms)); }
function anim(dur, fn, ease){ ease = ease || eo; const t = tok; if (RM || dur <= 0){ fn(1); return; }
  const t0 = performance.now(); (function f(now){ if (t !== tok) return; const p = Math.min(1, (now - t0)/dur); fn(ease(p)); if (p < 1) requestAnimationFrame(f); })(t0); }
function E(par, tag, cls, html, css){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) e.style.cssText = css; if (par) par.appendChild(e); return e; }
function count(el, to, dur, suf){ suf = suf || ''; anim(dur, p => el.textContent = Math.round(to*p).toLocaleString() + suf); }
function typeT(el, text, speed){ let i = 0; const t = tok; el.classList && el.classList.add('focus');
  (function s(){ if (t !== tok) return; el.textContent = text.slice(0, ++i); if (i < text.length) timers.push(setTimeout(s, RM ? 0 : speed)); else el.classList && el.classList.remove('focus'); })(); }
function rel(el, cv){ const a = el.getBoundingClientRect(), b = cv.getBoundingClientRect(); return { x:(a.left-b.left)/S, y:(a.top-b.top)/S, w:a.width/S, h:a.height/S }; }
const NS = 'http://www.w3.org/2000/svg';
function svgEl(par, tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); par.appendChild(e); return e; }
const WB = t => `<div class="wb"><i></i><i></i><i></i><span>${t}</span><em>● Running</em></div>`;
const AVC = ['#6366f1','#0ea5e9','#f59e0b','#10b981','#ef4444','#8b5cf6','#14b8a6','#f97316'];
const ICON = {
  form:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',

};

/* ================= 0 · inbox → program ================= */
function show0(cv){

  const M = [

  const times = ['9:02','9:14','9:20','9:31','9:47','10:03','10:12','10:26','10:41'];

    T(120 + i*130, () => c.classList.add('shw'));

/* ================= gantt builder ================= */
function gantt(cv, cfg){
  const W = E(cv,'div','w pop',`<div class="wb"><i></i><i></i><i></i><span>${cfg.file}</span></div>
    <div class="gh"><div><h4>${cfg.title}</h4><p>${cfg.sub}</p></div><div class="gtabs"><span class="on">Timeline</span><span>Board</span><span>Docs</span></div><span class="av" style="background:#18202b;width:26px;height:26px;font-size:9.5px">MH</span></div>
    <div class="gbody"></div>`,'left:0;top:0;width:760px;height:500px');
  const B = W.querySelector('.gbody');
  const X0 = 224, TW = 516, RH = cfg.rh || 44, TOP = 38, X = f => X0 + f*TW;
  cfg.phases.forEach((p,i) => E(B,'div','gph' + (i%2 ? ' alt' : ''),`<span>${p.n}</span>`,`left:${X(p.a)}px;width:${(p.b-p.a)*TW}px`));
  cfg.rows.forEach((r,i) => { r.y = TOP + i*RH; const row = E(B,'div','grow' + (r.id ? ' click' : ''),`<span class="av" style="background:${r.c||'#18202b'}">MH</span><div><b>${r.t}</b><span>${r.s}</span></div>`,`top:${r.y}px;height:${RH}px`); T(200 + i*70, () => row.classList.add('on')); if (r.id) row.addEventListener('click', () => openD(r.id)); });
  const svg = svgEl(B,'svg',{class:'gdeps',width:760,height:418});
  const defs = svgEl(svg,'defs',{}); const mk = svgEl(defs,'marker',{id:'ah'+cfg.id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'}); svgEl(mk,'path',{d:'M0,0 L10,5 L0,10 z',fill:'#94a3b8'});
  cfg.rows.forEach((r,i) => {
    const top = r.y + (RH-28)/2;
    if (r.hz) r.hzEl = E(B,'div','ghz','',`left:${X(r.b)-8}px;top:${top}px;width:${(cfg.hz-r.b)*TW+8}px`);
    const ic = r.k === 'done' ? ICON.check : '';
    r.el = E(B,'div','gbar k-' + r.k + (r.alt?' alt':'') + (r.id?' click':''),`${r.k==='prog'?'<i class="gf"></i>':''}${ic}<span class="gl">${r.l||''}</span>${r.chip?`<em>${r.chip}</em>`:''}`,`left:${X(r.a)}px;top:${top}px;width:${(r.b-r.a)*TW}px`);
    if (r.id) r.el.addEventListener('click', () => openD(r.id));
    const at = r.at != null ? r.at : cfg.t0 + i*cfg.step;
    T(at, () => { r.el.classList.add('on'); if (r.prog) T(500, () => r.el.querySelector('.gf').style.width = r.prog + '%'); });
  });
  (cfg.deps||[]).forEach(d => {
    const a = cfg.rows[d[0]], b = cfg.rows[d[1]];
    const x1 = X(a.b), y1 = a.y + RH/2 + 14, x2 = X(b.a), y2 = b.y + RH/2 - 14;
    const p = svgEl(svg,'path',{d:`M${x1-6},${y1} C${x1-6},${y1+14} ${x2+6},${y2-14} ${x2+6},${y2}`,pathLength:1,'marker-end':`url(#ah${cfg.id})`});
    const at = (b.at != null ? b.at : cfg.t0 + d[1]*cfg.step) - 120;
    T(at, () => p.classList.add('on'));
  });
  if (cfg.hz){
    cfg.rows.forEach((r,i) => { if (r.hzEl) T(cfg.hzAt + i*90, () => r.hzEl.classList.add('on')); });
    cfg.rows.forEach(r => {
      if (r.rebuilt){ const g = E(B,'div','grb','↻ Rebuilt',`left:${X((r.b+cfg.hz)/2)}px;top:${r.y+RH/2}px`); T(cfg.hzAt + 700, () => g.classList.add('on')); }
      if (r.ms){ const g = E(B,'div','gms',`<i></i><span>${r.ms}</span>`,`left:${X(cfg.hz)}px;top:${r.y+RH/2}px`); T(cfg.hzAt + 1000, () => g.classList.add('on')); }
    });
  }
  if (cfg.today != null){
    const td = E(B,'div','gtd',`<span>${cfg.todayLabel||'Today'}</span>`,`left:${X0}px`);
    T(cfg.todayAt, () => { td.classList.add('on'); anim(1800, p => td.style.left = (X0 + p*cfg.today*TW) + 'px', eio); });
  }
  if (cfg.legend){ const lg = E(B,'div','glg',cfg.legend); T(cfg.legendAt || 3000, () => lg.classList.add('on')); }
}

function show2(cv){
  const W = E(cv,'div','w pop',`${WB('Candidate Comms · auto-drafted')}

  const els = S4.map(s => E(slots,'div','slot',`<time>${s[0]}</time><div><b>${s[1]}</b><span>${s[2]}</span></div>`));
  const rec = E(slots,'div','slot rec',`<time>On invite</time><div><b>R. Patel · Recruiter</b><span>Added to the panel for visibility</span></div><i class="strike"></i><span class="xchip mchip rd">Not listed</span>`);
